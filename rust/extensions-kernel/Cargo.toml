[package]
name = "extensions-kernel"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
extensions-manager-rust-security-core = { path = "../extensions-security-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "45.0.3", features = ["cache", "wat"] }
