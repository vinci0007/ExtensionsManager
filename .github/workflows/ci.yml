name: CI

# Functional gate on every push/PR: Rust workspace tests (debug profile) and
# the TypeScript suite. The Release workflow (release.yml) additionally runs
# the release-profile suite on all three platforms before publishing.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
