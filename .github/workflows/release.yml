name: Release

# Builds the embeddable kernel artifacts for every supported platform and
# publishes them on the GitHub Release of the pushed v* tag — upstream hosts
# integrate without installing Rust.
#
# Artifacts per platform (see docs/host-integration-guide.md "Part 0"):
#   - extensions_kernel.dll / libextensions_kernel.so / libextensions_kernel.dylib  (C ABI cdylib)
#   - kernel.node                                                                   (Node N-API addon)
#   - extensionsd.exe / extensionsd                                                 (daemon sidecar)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            cdylib: extensions_kernel.dll
            napi: extensions_kernel_napi.dll
            daemon: extensionsd.exe
            archive: extensions-kernel-windows-x64.zip
          - os: ubuntu-latest
            platform: linux-x64
            cdylib: libextensions_kernel.so
            napi: libextensions_kernel_napi.so
            daemon: extensionsd
            archive: extensions-kernel-linux-x64.tar.gz
          - os: macos-latest
            platform: macos-arm64
            cdylib: libextensions_kernel.dylib
            napi: libextensions_kernel_napi.dylib
            daemon: extensionsd
            archive: extensions-kernel-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release -p extensions-kernel -p extensions-kernel-napi -p extensionsd

      - name: Test (release)
        run: cargo test --release --workspace

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p stage
          cp "rust/target/release/${{ matrix.cdylib }}" stage/
          cp "rust/target/release/${{ matrix.napi }}" stage/kernel.node
          cp "rust/target/release/${{ matrix.daemon }}" stage/
          cp README.md docs/host-integration-guide.md stage/

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath "${{ matrix.archive }}"

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
